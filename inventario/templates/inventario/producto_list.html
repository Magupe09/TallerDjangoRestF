<h1>Productos</h1>
<a href="{% url 'producto_create' %}">+ Nuevo Producto</a>
<ul>
  {% for producto in object_list %}
  <li>
    <a href="{% url 'producto_detail' producto.pk %}">{{ producto.nombre }}</a>
    — <a href="{% url 'producto_update' producto.pk %}">Editar</a> —
    <a href="{% url 'producto_delete' producto.pk %}">Eliminar</a>
  </li>
  {% endfor %}
</ul>

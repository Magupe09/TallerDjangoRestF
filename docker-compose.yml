services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: heladeria
      POSTGRES_PASSWORD: heladeria
      POSTGRES_DB: heladeria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: heladeria
      DB_USER: heladeria
      DB_PASSWORD: heladeria
      DB_HOST: db
      DB_PORT: 5432

volumes:
  postgres_data:
